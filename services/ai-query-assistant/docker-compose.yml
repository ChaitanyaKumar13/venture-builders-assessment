# Runs the whole AI Query Assistant service: Postgres + backend + frontend.
# LLM runs on the host (Ollama) or a hosted OpenAI-compatible API — see README.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aqa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aqa_password}
      POSTGRES_DB: ${POSTGRES_DB:-aqa}
    volumes:
      - aqa_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aqa}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      PORT: 4001
      DATABASE_URL: postgres://${POSTGRES_USER:-aqa}:${POSTGRES_PASSWORD:-aqa_password}@db:5432/${POSTGRES_DB:-aqa}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    ports:
      - "4001:4001"
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4001
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  aqa_db:
